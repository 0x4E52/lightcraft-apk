[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
# corpus download checksums
sha2 = { workspace = true }
# precompressed web bundle (`cargo xtask web`); pure Rust
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# Android APK assembly (`cargo xtask android apk`): raw-copies aapt2's entries and appends the Stored,
# 16 KB-aligned .so. No compression feature: nothing is (de)compressed here. Already in Cargo.lock
# through candle-core; MIT
zip = { version = "=7.2.0", default-features = false }
